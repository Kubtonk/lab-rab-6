name: Docker Image CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: cloud-lab11:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image
        run: docker image inspect cloud-lab11:ci

      - name: Smoke test container
        run: |
          docker run -d --name lab11-smoke -p 127.0.0.1:5050:5000 cloud-lab11:ci
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:5050/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs lab11-smoke
          exit 1

      - name: Remove test container
        if: always()
        run: docker rm -f lab11-smoke || true
